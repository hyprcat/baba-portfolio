# DigitalOcean App Platform spec for the portfolio.
# Static site tier: free for the first 3 sites per account.
# For CLI deploys: `doctl apps create --spec .do/app.yaml`.
# The "Deploy to DigitalOcean" button uses `.do/deploy.template.yaml` instead
# (same content, but wrapped under a top-level `spec:` key).
name: baba-portfolio
region: fra
static_sites:
  - name: web
    source_dir: /
    build_command: npm ci && npm run build
    output_dir: dist
    catchall_document: 404.html
    envs:
      - key: NODE_VERSION
        scope: BUILD_TIME
        value: "20"
