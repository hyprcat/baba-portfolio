# DigitalOcean App Platform spec for the portfolio.
# Static site tier: free for the first 3 sites per account.
# For CLI deploys: `doctl apps create --spec .do/app.yaml`.
# The "Deploy to DigitalOcean" button uses `.do/deploy.template.yaml` instead
# (same content, but wrapped under a top-level `spec:` key).
#
# CACHE-CONTROL LIMITATION: DO App Platform hardcodes static-site responses to
# `public, max-age=10, s-maxage=86400` and provides no app-spec field to
# override it (open since 2022, confirmed unfixed by DO support May 2025:
# ideas.digitalocean.com/app-platform/p/modify-caching-policy-for-static-pages).
# The 10s browser cache is what trips Lighthouse's "Use efficient cache
# lifetimes" audit on /fonts/*. The `public/_headers` file in this repo
# encodes the correct rules in the Netlify / Cloudflare Pages convention so
# migrating off DO is a one-host-flip change.
name: baba-portfolio
region: fra
static_sites:
  - name: web
    source_dir: /
    build_command: npm ci && npm run build
    output_dir: dist
    catchall_document: 404.html
    envs:
      - key: NODE_VERSION
        scope: BUILD_TIME
        value: "20"
