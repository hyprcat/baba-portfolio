# DigitalOcean App Platform deploy template.
# Picked up by the "Deploy to DigitalOcean" button in README.md when a user
# clicks it from the GitHub repo page. The `spec:` wrapper is REQUIRED — the
# button silently does nothing without it. See:
# https://docs.digitalocean.com/products/app-platform/how-to/add-deploy-do-button/
#
# For `doctl apps create --spec ...` use `.do/app.yaml` instead (no wrapper).
spec:
  name: baba-portfolio
  region: fra
  static_sites:
    - name: web
      source_dir: /
      build_command: npm ci && npm run build
      output_dir: dist
      catchall_document: 404.html
      git:
        branch: main
        repo_clone_url: https://github.com/hyprcat/baba-portfolio.git
      envs:
        - key: NODE_VERSION
          scope: BUILD_TIME
          value: "20"
